<body>
  <a class="skip-link" href="#main">本文へ移動</a>
  <aside class="sidebar">
    <a class="brand" href="#home" aria-label="FP2級・FP3級 学習トレーナー ホーム"><span class="brand-mark">FP<span>2・3</span></span><span>FP2級・FP3級<span class="brand-sub">学習トレーナー</span></span></a>
    <p class="nav-label">学習メニュー</p>
    <nav id="nav" aria-label="メインメニュー">
      <a href="#home" data-page="home"><span class="nav-icon" data-icon="home"></span><span>ホーム</span></a>
      <a href="#settings" data-page="settings"><span class="nav-icon" data-icon="book"></span><span>問題演習</span></a>
      <a href="#stats" data-page="stats"><span class="nav-icon" data-icon="chart"></span><span>学習成績</span></a>
      <a href="#data" data-page="data"><span class="nav-icon" data-icon="settings"></span><span>データ・設定</span></a>
    </nav>
    <div class="sidebar-note"><span class="small-dot"></span>あなたのペースで、着実に。<p>6分野・300問の演習</p></div>
  </aside>
  <div class="shell">
    <header class="topbar"><span class="topbar-title">FP 学習トレーナー</span><label class="grade-control" for="grade-select">出題範囲<select id="grade-select" aria-label="出題範囲" disabled><option value="2">FP2級（4択）</option><option value="3">FP3級（○×・3択）</option></select></label><div class="status"><span id="network-status">接続状況を確認中</span><span class="stage-tag">問題集 / 300問</span></div></header>
    <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>

    <div class="study-workspace">
      <main id="main" tabindex="-1"><div class="loading"><span class="brand-mark">FP<span>2・3</span></span><p>問題データを読み込んでいます…</p></div></main>

      </aside>
    </div>
